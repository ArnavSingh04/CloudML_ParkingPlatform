# Internal-only Service. The API reaches the camera at http://camera-service:8081
# (Kubernetes DNS), so it never needs the camera pod's IP. Port 8081 forwards to
# the container's port 8001.
apiVersion: v1
kind: Service
metadata:
  name: camera-service
  namespace: smartpark
spec:
  type: ClusterIP                 # reachable by other pods, not the internet
  selector: { app: smartpark-camera }
  ports:
    - { port: 8081, targetPort: 8001 }
