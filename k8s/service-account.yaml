# Kubernetes ServiceAccount the pods run as. With Workload Identity Federation
# for GKE, IAM roles are granted DIRECTLY to this SA's principal (see step 12 /
# setup.sh) — so there is no Google service account and no annotation here, and
# no downloadable key anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartpark-app
  namespace: smartpark
